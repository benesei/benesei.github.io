# Site
title: blank
first_name: Benedikt
middle_name:
last_name: Seiter
contact_note:
description: Personal website of Benedikt Seiter, an MSc Mathematics student at ETH Zurich working on statistics, machine learning, and causality.
keywords: Benedikt Seiter, statistics, machine learning, causality, ETH Zurich
lang: en

url: https://benesei.github.io
baseurl: ""

footer_text:
last_updated: true
impressum_path:

# Layout
navbar_fixed: true
footer_fixed: false
back_to_top: false
max_width: 930px
enable_darkmode: true
enable_navbar_social: false
enable_progressbar: false

# Metadata
serve_og_meta: true
serve_schema_org: false
og_image:

# Disabled features
search_enabled: false
socials_in_search: false
posts_in_search: false
bib_search: true
protect_email: false
enable_cookie_consent: false
enable_masonry: false
enable_math: false
enable_medium_zoom: false
enable_project_categories: false
enable_tooltips: false
enable_video_embedding: false

newsletter:
  enabled: false

imagemagick:
  enabled: false
lazy_loading_images: true

# al-folio v1 runtime contract
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

# Publications
scholar:
  last_name: [Seiter]
  first_name: [Benedikt]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending

enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false
enable_publication_thumbnails: true
max_author_limit: 3

filtered_bibtex_keywords:
  - abbr
  - abstract
  - additional_info
  - altmetric
  - annotation
  - arxiv
  - award
  - award_name
  - bibtex_show
  - blog
  - code
  - dimensions
  - eprint
  - google_scholar_id
  - hal
  - html
  - inspirehep_id
  - pdf
  - pmid
  - poster
  - preview
  - selected
  - slides
  - supp
  - video
  - website

# Icon fonts
third_party_libraries:
  download: false
  google_fonts:
    url:
      fonts: "https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap"
  fontawesome:
    integrity:
      css: "sha256-MVopmdyC2tYTiJ8wlktf0uh0v4NgT+vNdyVFepi7Q0c="
    url:
      css: "https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css"
    version: "7.2.0"
  academicons:
    integrity:
      css: "sha256-SzrCOBJbGVFMahewkgjwnApaV2+av1DwMAA+/QGLyZw="
    url:
      css: "https://cdn.jsdelivr.net/npm/academicons@1.9.5/css/academicons.min.css"
    version: "1.9.5"
  scholar-icons:
    integrity:
      css: "sha256-VY3hHVj/hNX3fYG6wtbA6TcKJQl7+FthzGSyIB64klY="
    url:
      css: "https://cdn.jsdelivr.net/npm/scholar-icons@1.0.3/css/scholar-icons.css"
    version: "1.0.3"

# Jekyll
theme: al_folio_core
include: [_pages]
exclude:
  - .agents/
  - .bundle/
  - .codex/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor/
keep_files:
  - CNAME
  - .nojekyll

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

sass:
  style: compressed

defaults:
  - scope:
      path: assets
    values:
      sitemap: false

plugins:
  - jekyll-cache-bust
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - al_folio_core
  - al_icons
  - al_citations
  - al_folio_upgrade
